# 배포 백엔드(Render 무료 플랜)는 15분 동안 요청이 없으면 잠들고 깨는 데 약 1분 걸린다.
# 포트폴리오 확인 시간대인 평일(월~금) 09:00~18:00 KST에만 10분마다 /health(인증·DB 없음)를 불러
# 잠들지 않게 한다(U-25, plan.md FD-30). 깨는 데 약 1분 걸리므로 08:50에 한 번 미리 깨운다. 그 밖의 시간에는 깨우지 않는다. 비밀값을 쓰지 않는다.
# cron은 UTC다: UTC 00:00~08:50 = KST 09:00~17:50(같은 날이라 요일도 같다). 마지막 요청 뒤 15분, 18:05쯤 잠든다.
# 예약 실행은 기본 브랜치(main)에서만 동작하고, GitHub 사정으로 몇 분 늦어질 수 있다.
name: keep-api-awake

on:
  schedule:
    # 08:50 KST(UTC 전날 23:50, 일~목)에 한 번 미리 깨워 09:00에는 이미 깨어 있게 한다.
    - cron: "50 23 * * 0-4"
    - cron: "*/10 0-8 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-api-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /health
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 5 -o /dev/null -w "status=%{http_code} total=%{time_total}s\n" https://ddallang-api.onrender.com/health
