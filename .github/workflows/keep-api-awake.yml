# 배포 백엔드(Render 무료 플랜)는 15분 동안 요청이 없으면 잠들고 깨는 데 약 1분 걸린다.
# 10분마다 /health(인증·DB 없음)를 불러 잠들지 않게 한다(U-23, plan.md FD-30). 비밀값을 쓰지 않는다.
# 예약 실행은 기본 브랜치(main)에서만 동작하고, GitHub 사정으로 몇 분 늦어질 수 있다.
name: keep-api-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-api-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /health
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 5 -o /dev/null -w "status=%{http_code} total=%{time_total}s\n" https://ddallang-api.onrender.com/health
